# Builds ready-to-run Windows binaries and attaches them to a GitHub Release,
# so anyone can download and run the app without Visual Studio or the SDK.
#
# Trigger: push a version tag, e.g.
#   git tag v2.0.0
#   git push origin v2.0.0
#
# Produces two assets on the Release:
#   * MagazineGrabber-<tag>-selfcontained-win-x64.exe  (runs on vanilla Windows 11, no install)
#   * MagazineGrabber-<tag>-net10-required-win-x64.exe (tiny, needs the .NET 10 Desktop Runtime)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # also allows running it manually from the Actions tab

permissions:
  contents: write       # required to create the Release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish MagazineGrabber/MagazineGrabber.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -p:SatelliteResourceLanguages=en
          -p:DebugType=none
          -o publish/selfcontained

      - name: Publish framework-dependent single-file EXE
        run: >
          dotnet publish MagazineGrabber/MagazineGrabber.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/framework

      - name: Name the assets
        shell: pwsh
        run: |
          Copy-Item publish/selfcontained/MagazineGrabber.exe "MagazineGrabber-${{ github.ref_name }}-selfcontained-win-x64.exe"
          Copy-Item publish/framework/MagazineGrabber.exe     "MagazineGrabber-${{ github.ref_name }}-net10-required-win-x64.exe"

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MagazineGrabber-*-selfcontained-win-x64.exe
            MagazineGrabber-*-net10-required-win-x64.exe
